      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="0.6" stop-color="#e5484d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0"/>
