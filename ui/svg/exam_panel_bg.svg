<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <!-- Exam window background, 1280x760 at 1080p (scale uniformly). Layout guide:
     header text x 128..1100, y 30..106 • timer ring centre (1188,68), r 40 • question well y 150..350
     • answer buttons y 372..664 (two columns, 560x76 each) • source/citation strip y 700..736.
     Borders use nakshi-kantha running stitches; the header icon is an alpona lotus. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121922" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#f2a541" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a541"/>
      <stop offset="0.5" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="14" y="20" width="1256" height="736" rx="26" fill="#000000" fill-opacity="0.25"/>
  <rect x="8" y="12" width="1260" height="740" rx="26" fill="#000000" fill-opacity="0.18"/>
  <rect x="4" y="4" width="1272" height="748" rx="24" fill="url(#base)"/>
  <rect x="4" y="4" width="1272" height="748" rx="24" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="1270.5" height="746.5" rx="23.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M28 24 H1110 L1134 48 V90 L1110 114 H28 Z" fill="url(#head)"/>
  <rect x="24" y="24" width="6" height="704" rx="3" fill="url(#spine)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M40 126 H1240" stroke="#f2a541" stroke-opacity="0.55" stroke-width="2.2" stroke-dasharray="11 7"/>
    <path d="M49 132 H1240" stroke="#e5484d" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="11 7"/>
    <path d="M40 690 H1240" stroke="#f2a541" stroke-opacity="0.35" stroke-width="1.8" stroke-dasharray="11 7"/>
  </g>
  <rect x="56" y="150" width="1168" height="200" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.07"/>
  <path d="M56 166 V182 M56 166 H72" stroke="#f2a541" stroke-width="2.5" stroke-linecap="round" fill="none" transform="translate(6 -10)"/>
  <rect x="56" y="700" width="1168" height="36" rx="10" fill="#000000" fill-opacity="0.28"/>
  <circle cx="1188" cy="68" r="40" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <g transform="translate(78 68)">
    <circle r="33" fill="none" stroke="#f2a541" stroke-opacity="0.55" stroke-width="3.2" stroke-dasharray="0.01 6.47" stroke-linecap="round"/>
    <circle r="26" fill="none" stroke="#f2a541" stroke-opacity="0.35" stroke-width="1.2"/>
    <g fill="#f2a541" fill-opacity="0.9">
      <ellipse cx="0" cy="-14" rx="5.5" ry="11"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(45)"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(90)"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(135)"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(180)"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(225)"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(270)"/>
      <ellipse cx="0" cy="-14" rx="5.5" ry="11" transform="rotate(315)"/>
    </g>
    <circle r="7.5" fill="#e5484d"/>
    <circle r="3" fill="#fff4dc"/>
  </g>
  <g transform="translate(1218 724)" opacity="0.4">
    <g fill="#f2a541">
      <ellipse cx="0" cy="-8" rx="3" ry="6.5"/>
      <ellipse cx="0" cy="-8" rx="3" ry="6.5" transform="rotate(60)"/>
      <ellipse cx="0" cy="-8" rx="3" ry="6.5" transform="rotate(120)"/>
      <ellipse cx="0" cy="-8" rx="3" ry="6.5" transform="rotate(180)"/>
      <ellipse cx="0" cy="-8" rx="3" ry="6.5" transform="rotate(240)"/>
      <ellipse cx="0" cy="-8" rx="3" ry="6.5" transform="rotate(300)"/>
    </g>
    <circle r="3.5" fill="#e5484d"/>
  </g>
</svg>
